[[language]]
name = "go"
auto-format = true
language-servers = [ "gopls" ]

[language-server.gopls.config]
allExperiments = true
completionDocumentation = true
completeUnimported = true
deepCompletion = true
expandWorkspaceToModule = true
gofumpt = true
hoverKind = "FullDocumentation"
importShortcut = "Both"
linksInHover = true
matcher = "Fuzzy"
semanticTokens = true
staticcheck = true
symbolMatcher = "Fuzzy"
symbolStyle = "Dynamic"
usePlaceholders = true

[language-server.gopls.config.analyses]
unusedparams = true
unusedwrite = true
useany = true
unreachable = true
nilness = true
shadow = true
simplifycompositelit = true
simplifyrange = true
simplifyslice = true
unusedresult = true

[language-server.gopls.config.codelenses]
generate = true
regenerate_cgo = true
test = true
tidy = true
upgrade_dependency = true
vendor = true
gc_details = true

[language-server.golangci-lint-lsp]
command = "golangci-lint-langserver"

[language-server.golangci-lint-lsp.config]
command = ["golangci-lint", "run", "--output.json.path", "stdout", "--show-stats=false", "--issues-exit-code=1"]

[[language]]
name = "python"
auto-format = true
language-servers = ['pyright', 'ruff']
roots = [".", "pyproject.toml", "pyrightconfig.json"]
indent = { tab-width = 4, unit = "    " }

### black

[language.formatter]
command = 'black'
args = ['-', '--quiet']

### pylsp

[language-server.pylsp]
command = "pylsp"

[language-server.pylsp.config.pylsp.plugins]
pyflakes = {enabled = false}
mccabe = {enabled = false}
pyls_isort = {enabled = false}
pycodestyle = {enabled = false, maxLineLength = 88}
pydocstyle = {enabled = false}
autopep8 = {enabled = false}
yapf = {enabled = false}
flake8 = {enabled = true}
pylint = {enabled = false}
ruff = {enabled = true, extendSelect = ["I"]}
mypy = {enabled = true, live_mode = true, strict = true}

### pyright

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.pyright.config]
reportMissingTypeStubs = false

[language-server.pyright.config.python.analysis]
typeCheckingMode = "basic"
autoImportCompletions = true

### ruff

[language-server.ruff]
command = "ruff"
args = ['server', '-q', '--preview']

[language-server.ruff.config]
settings = {args = []}


[[language]]
name = "typescript"
auto-format = true
language-servers = ['typescript-language-server']
roots = [".", "package.json", "tsconfig.json"]
formatter = { command = "npx", args = ["prettier", "--parser", "typescript"] }
